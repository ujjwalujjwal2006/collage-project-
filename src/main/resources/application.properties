# ====== Server ======
server.port=8080

# ====== H2 Database (file-based persistence) ======
spring.datasource.url=jdbc:h2:file:./data/canteen
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create tables on startup, update on subsequent runs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (access at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====== File Upload ======
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ====== Application ======
app.upload-dir=src/main/resources/static/uploads
app.manager-password=admin123

# ====== SQL Init ======
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true
